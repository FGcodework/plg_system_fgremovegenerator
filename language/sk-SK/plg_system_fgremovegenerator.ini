PLG_SYSTEM_FGREMOVEGENERATOR_FIELD_SUPPORT_DESC="<style>a.fg-kofi[target='_blank']::before{content:none;padding:0}</style><div class='mb-3'><strong>Tento plugin je bezplatný a open source.</strong> Ak vám ušetril čas, jednorazový príspevok na Ko-fi je vítaný, no úplne dobrovoľný - žiadna funkcia tu nie je nikdy zamknutá za platbou.</div><div class='d-flex align-items-center gap-3'><a href='https://ko-fi.com/fgcodework' target='_blank' rel='noopener noreferrer' class='fg-kofi'><img src='https://storage.ko-fi.com/cdn/kofi3.png?v=4' alt='ko-fi' width='180'></a><a href='https://fgcodework.github.io/' target='_blank' rel='noopener noreferrer' class='btn' style='--btn-color:var(--atum-btn);--btn-bg:var(--atum-btn-bg);--btn-border-color:hsl(var(--hue),20%,80%);--btn-hover-color:var(--atum-btn-hvr);--btn-hover-bg:var(--atum-btn-bg-hvr);--btn-hover-border-color:var(--atum-btn-bg-hvr);--btn-active-color:var(--atum-btn-hvr);--btn-active-bg:var(--atum-btn-bg-hvr);--btn-active-border-color:var(--atum-btn-bg-hvr)'>Ďalšie FG rozšírenia</a></div>"